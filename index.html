<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Royale 2D Ultra</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; background:#111; color:#fff; text-align:center; }
  h1 { margin-top:40px; font-size:40px; color:#facc15; text-shadow:2px 2px #000; }
  canvas { background:#333; display:none; margin:20px auto; border:3px solid #fff; }
  #hud { margin-top:10px; display:none; gap:20px; font-size:16px; justify-content:center; }
  #menu { margin-top:50px; }
  button { margin-top:20px; padding:15px 25px; border:none; border-radius:8px; background:#6366f1; color:white; font-size:18px; cursor:pointer; transition:0.3s; }
  button:hover { background:#4f46e5; transform:scale(1.05); }
</style>
</head>
<body>
  <h1>🔥 Battle Royale 2D Ultra 🔥</h1>

  <!-- Menu d'accueil -->
  <div id="menu">
    <p>Bienvenue dans le Battle Royale ultime.<br>Survis, ramasse des armes et sois le dernier en vie !</p>
    <button id="startBtn">▶️ Commencer la partie</button>
  </div>

  <!-- Zone de jeu -->
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="hud">Joueurs restants: <span id="playersLeft">0</span> | Santé: <span id="playerHealth">100</span> | Arme: <span id="playerWeapon">Pistolet</span> | Munitions: <span id="ammo">0</span></div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const menu = document.getElementById('menu');
const playersLeftEl = document.getElementById('playersLeft');
const playerHealthEl = document.getElementById('playerHealth');
const playerWeaponEl = document.getElementById('playerWeapon');
const ammoEl = document.getElementById('ammo');
const hud = document.getElementById('hud');

let gameInterval;
const PLAYER_SIZE = 20;
const MAP_WIDTH = canvas.width;
const MAP_HEIGHT = canvas.height;
let zoneRadius = 350;

class Player {
  constructor(x, y, color, isAI=false){
    this.x = x;
    this.y = y;
    this.color = color;
    this.isAI = isAI;
    this.health = 100;
    this.weapon = 'Pistolet';
    this.ammo = 10;
    this.speed = 2;
  }
}

let player;
let enemies = [];
let bullets = [];
let objects = [];

function initGame(){
  player = new Player(400, 300, 'blue');
  enemies = [];
  for(let i=0;i<10;i++){
    enemies.push(new Player(Math.random()*MAP_WIDTH, Math.random()*MAP_HEIGHT, 'red', true));
  }
  bullets = [];
  objects = [];
  for(let i=0;i<10;i++){
    let typeRandom = Math.random();
    let type = typeRandom<0.33?'health':(typeRandom<0.66?'ammo':'fusil');
    objects.push({x: Math.random()*MAP_WIDTH, y: Math.random()*MAP_HEIGHT, type});
  }
  zoneRadius = 350;
  updateHUD();
}

function updateHUD(){
  playersLeftEl.textContent = 1 + enemies.filter(e=>e.health>0).length;
  playerHealthEl.textContent = Math.max(0, Math.floor(player.health));
  playerWeaponEl.textContent = player.weapon;
  ammoEl.textContent = player.ammo;
}

function draw(){
  ctx.clearRect(0,0,MAP_WIDTH,MAP_HEIGHT);
  ctx.strokeStyle='yellow'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(MAP_WIDTH/2, MAP_HEIGHT/2, zoneRadius, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = player.color; ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);
  enemies.forEach(e=>{ if(e.health>0){ ctx.fillStyle=e.color; ctx.fillRect(e.x, e.y, PLAYER_SIZE, PLAYER_SIZE); } });
  bullets.forEach(b=>{ ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,5,5); });
  objects.forEach(o=>{ ctx.fillStyle=o.type==='health'?'green':(o.type==='ammo'?'orange':'cyan'); ctx.beginPath(); ctx.arc(o.x,o.y,8,0,Math.PI*2); ctx.fill(); });
}

function update(){
  zoneRadius = Math.max(50, zoneRadius-0.02);
  bullets.forEach((b,i)=>{
    b.x += b.vx; b.y += b.vy;
    if(b.x<0||b.x>MAP_WIDTH||b.y<0||b.y>MAP_HEIGHT){ bullets.splice(i,1); }
    enemies.forEach(e=>{
      if(e.health>0 && b.x>e.x && b.x<e.x+PLAYER_SIZE && b.y>e.y && b.y<e.y+PLAYER_SIZE){ e.health -= b.damage; bullets.splice(i,1); }
    });
  });
  objects.forEach((o,i)=>{
    if(player.x<o.x+8 && player.x+PLAYER_SIZE>o.x-8 && player.y<o.y+8 && player.y+PLAYER_SIZE>o.y-8){
      if(o.type==='health'){ player.health = Math.min(100, player.health+30); }
      else if(o.type==='ammo'){ player.ammo +=10; }
      else if(o.type==='fusil'){ player.weapon='Fusil'; player.ammo+=15; }
      objects.splice(i,1);
    }
  });
  enemies.forEach(e=>{
    if(e.health>0){
      let dx=player.x-e.x; let dy=player.y-e.y; let dist=Math.hypot(dx,dy);
      e.x += (dx/dist)*1.5; e.y += (dy/dist)*1.5;
      if(dist<200 && Math.random()<0.02 && e.ammo>0){
        bullets.push({x:e.x+PLAYER_SIZE/2-2.5,y:e.y+PLAYER_SIZE/2-2.5,vx:(dx/dist)*5,vy:(dy/dist)*5,color:'red',damage:20}); e.ammo--;
      }
    }
  });
  if(Math.hypot(player.x-MAP_WIDTH/2,player.y-MAP_HEIGHT/2)>zoneRadius){ player.health -=0.2; }
  enemies.forEach(e=>{ if(Math.hypot(e.x-MAP_WIDTH/2,e.y-MAP_HEIGHT/2)>zoneRadius){ e.health -=0.2; } });
  updateHUD();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp') player.y-=player.speed;
  if(e.key==='ArrowDown') player.y+=player.speed;
  if(e.key==='ArrowLeft') player.x-=player.speed;
  if(e.key==='ArrowRight') player.x+=player.speed;
  if(e.key===' ' && player.ammo>0){
    bullets.push({x:player.x+PLAYER_SIZE/2-2.5, y:player.y+PLAYER_SIZE/2-2.5, vx:5, vy:0,color:'yellow',damage:20}); player.ammo--;
  }
  if(e.key==='1'){player.weapon='Pistolet';}
  if(e.key==='2'){player.weapon='Fusil';}
});

function gameLoop(){ update(); draw(); }

startBtn.onclick=()=>{
  menu.style.display="none";
  canvas.style.display="block";
  hud.style.display="flex";
  initGame();
  clearInterval(gameInterval);
  gameInterval = setInterval(gameLoop,1000/60);
};
</script>
</body>
</html>
